server {
    listen 8080;
    server_name _;
    root /tmp/www;
    index index.html;

    # Security headers (baseline ecosistema)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Tailwind CDN + Three/GSAP + Google Fonts + Stripe checkout redirects
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://checkout.stripe.com;" always;

    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ok":true,"app":"stackdock","service":"web"}';
    }

    location /download/ {
        types { application/x-apple-diskimage dmg; }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|dmg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
