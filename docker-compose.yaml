# Coolify build pack: dockercompose · stackdock.iareal.net → 127.0.0.1:3048
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3048:80"
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m
    security_opt:
      - no-new-privileges:true
    # nginx necesita crear temp paths; no dropear CAP_CHOWN/SETUID en alpine
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    environment:
      STRIPE_CHECKOUT_URL: ${STRIPE_CHECKOUT_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  coolify:
    external: true
    name: coolify
