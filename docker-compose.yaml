# Coolify build pack: dockercompose · stackdock.iareal.net → 127.0.0.1:3048 (Cloudflare Tunnel)
# La web prerenderizada y la API/licencias viven en el mismo proceso Node (server/src/index.js).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3048:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_DIR: /app/public
      STORAGE_DIR: /app/storage
      PUBLIC_URL: ${PUBLIC_URL:-https://stackdock.iareal.net}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-auto}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-david.del.rio.colin@gmail.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-stackdock@iareal.net}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      N8N_PAYMENT_WEBHOOK: ${N8N_PAYMENT_WEBHOOK:-https://n8n.vibesystems.tech/webhook/payment}
      N8N_TRIAL_WEBHOOK: ${N8N_TRIAL_WEBHOOK:-}
    volumes:
      - /opt/stackdock/storage:/app/storage
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /dev/shm:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  coolify:
    external: true
    name: coolify
