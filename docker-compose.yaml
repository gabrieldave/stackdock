# Coolify build pack: dockercompose
# Puerto host 3048 = siguiente libre tras findaro (3047) en Cloudflare Tunnel.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3048:8080"
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      STRIPE_CHECKOUT_URL: ${STRIPE_CHECKOUT_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  coolify:
    external: true
    name: coolify
