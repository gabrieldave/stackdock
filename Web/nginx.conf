server {
    listen 80;
    server_name _;
    root /tmp/www;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ok":true,"app":"stackdock","service":"web"}';
    }

    location /download/ {
        alias /tmp/www/public/download/;
        types { application/x-apple-diskimage dmg; }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /public/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # EN default at /
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # ES locale under /es (same SPA shell; client sets lang via path)
    location = /es {
        return 301 /es/;
    }

    location = /es/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /es/ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
